<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulation Univers — prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --panel-bg: rgba(13, 17, 26, 0.92);
      --panel-border: #2c3548;
      --accent: #ffd75e;
      --text: #dce3f0;
      --text-dim: #8b96ad;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    #view.dragging { cursor: grabbing; }

    #hud {
      position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center;
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 10px; padding: 8px 12px; user-select: none;
    }
    #hud button {
      background: #1a2233; color: var(--text); border: 1px solid var(--panel-border);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit;
    }
    #hud button.active { background: var(--accent); color: #14171f; border-color: var(--accent); font-weight: 600; }
    #hud .stat { color: var(--text-dim); font-size: 13px; min-width: 90px; }
    #hud .stat b { color: var(--text); font-variant-numeric: tabular-nums; }

    #panel {
      position: absolute; top: 12px; right: 12px; bottom: 12px; width: 320px;
      background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px;
      padding: 14px; overflow-y: auto; display: none;
    }
    #panel.open { display: block; }
    #panel h2 { margin: 0 0 2px; font-size: 17px; color: var(--accent); }
    #panel .subtitle { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }
    #panel h3 {
      margin: 16px 0 6px; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-dim);
    }
    #panel .comp { border: 1px solid var(--panel-border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
    #panel .comp-name { font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #a9c1ff; }
    #panel .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 3px 0; }
    #panel .field label { font-size: 13px; color: var(--text-dim); }
    #panel .field input {
      width: 110px; background: #10161f; color: var(--text); border: 1px solid var(--panel-border);
      border-radius: 5px; padding: 3px 6px; font: inherit; font-size: 13px; text-align: right;
    }
    #panel .field input:focus { outline: 1px solid var(--accent); }
    #panel .field .ro { font-size: 13px; font-variant-numeric: tabular-nums; }
    #panel .fate-event {
      display: flex; align-items: center; gap: 8px; border-left: 3px solid var(--accent);
      padding: 6px 8px; margin: 6px 0; background: #10161f; border-radius: 0 6px 6px 0; font-size: 13px;
    }
    #panel .fate-event .kind { font-weight: 600; }
    #panel .fate-event .when { color: var(--text-dim); flex: 1; }
    #panel .fate-event input { width: 76px; }
    #panel .fate-event button { background: none; border: none; color: #e06c6c; cursor: pointer; font-size: 15px; }
    #panel .hint { color: var(--text-dim); font-size: 12px; font-style: italic; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <aside id="panel"></aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
