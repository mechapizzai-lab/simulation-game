<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulation Univers — prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --panel-bg: rgba(13, 17, 26, 0.92);
      --panel-border: #2c3548;
      --accent: #ffd75e;
      --text: #dce3f0;
      --text-dim: #8b96ad;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    #view.dragging { cursor: grabbing; }

    #hud {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center;
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 10px; padding: 8px 12px; user-select: none;
    }
    #hud button {
      background: #1a2233; color: var(--text); border: 1px solid var(--panel-border);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit;
    }
    #hud button.active { background: var(--accent); color: #14171f; border-color: var(--accent); font-weight: 600; }
    #hud .stat { color: var(--text-dim); font-size: 13px; min-width: 90px; }
    #hud .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
    #hud button:disabled { opacity: 0.35; cursor: default; }

    #rules {
      position: absolute; top: 12px; left: 12px; bottom: 12px; width: 320px;
      background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px;
      padding: 14px; overflow-y: auto;
    }
    #rules h2 { margin: 0 0 2px; font-size: 17px; color: var(--accent); }
    #rules .subtitle { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }
    #rules h3 {
      margin: 16px 0 6px; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-dim);
    }
    #rules .budget { margin-bottom: 12px; }
    #rules .budget-text { font-size: 13px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
    #rules .budget-bar { height: 8px; background: #10161f; border: 1px solid var(--panel-border); border-radius: 4px; overflow: hidden; }
    #rules .budget-fill { height: 100%; background: #5aa0e0; border-radius: 4px; transition: width 0.3s; }
    #rules .budget-fill.full { background: #e0955a; }
    #rules .rule {
      border: 1px solid var(--panel-border); border-radius: 8px;
      padding: 8px 10px; margin-bottom: 8px; transition: opacity 0.2s;
    }
    #rules .rule.locked { opacity: 0.55; }
    #rules .rule.active { border-color: #3f6e46; background: rgba(63, 110, 70, 0.12); }
    #rules .rule-head { display: flex; justify-content: space-between; align-items: baseline; }
    #rules .rule-name { font-weight: 600; font-size: 14px; color: #a9c1ff; }
    #rules .rule.active .rule-name { color: #8fd49a; }
    #rules .rule-cost { font-size: 12px; color: var(--text-dim); }
    #rules .rule-desc { font-size: 12px; color: var(--text-dim); margin: 3px 0; }
    #rules .rule-status { font-size: 12px; font-style: italic; color: var(--accent); margin-bottom: 4px; }
    #rules .rule.active .rule-status { color: #8fd49a; }
    #rules .rule-params .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 3px 0; }
    #rules .rule-params label { font-size: 12px; color: var(--text-dim); }
    #rules .rule-params input {
      width: 90px; background: #10161f; color: var(--text); border: 1px solid var(--panel-border);
      border-radius: 5px; padding: 3px 6px; font: inherit; font-size: 12px; text-align: right;
    }
    #rules .rule-action {
      background: #1a2233; color: var(--text); border: 1px solid var(--panel-border);
      border-radius: 6px; padding: 3px 12px; cursor: pointer; font: inherit; font-size: 13px; margin-top: 2px;
    }
    #rules .rule-action:disabled { opacity: 0.4; cursor: default; }
    #rules .rule.active .rule-action { border-color: #6e4a3f; }
    #rules .log { font-size: 12px; }
    #rules .log-entry { color: var(--text-dim); padding: 3px 0; border-bottom: 1px solid rgba(44, 53, 72, 0.5); }
    #rules .log-entry.highlight { color: var(--accent); }

    #panel {
      position: absolute; top: 12px; right: 12px; bottom: 12px; width: 320px;
      background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px;
      padding: 14px; overflow-y: auto; display: none;
    }
    #panel.open { display: block; }
    #panel h2 { margin: 0 0 2px; font-size: 17px; color: var(--accent); }
    #panel .subtitle { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }
    #panel h3 {
      margin: 16px 0 6px; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-dim);
    }
    #panel .comp { border: 1px solid var(--panel-border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
    #panel .comp-name { font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #a9c1ff; }
    #panel .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 3px 0; }
    #panel .field label { font-size: 13px; color: var(--text-dim); }
    #panel .field input {
      width: 110px; background: #10161f; color: var(--text); border: 1px solid var(--panel-border);
      border-radius: 5px; padding: 3px 6px; font: inherit; font-size: 13px; text-align: right;
    }
    #panel .field input:focus { outline: 1px solid var(--accent); }
    #panel .field .ro { font-size: 13px; font-variant-numeric: tabular-nums; }
    #panel .fate-event {
      display: flex; align-items: center; gap: 8px; border-left: 3px solid var(--accent);
      padding: 6px 8px; margin: 6px 0; background: #10161f; border-radius: 0 6px 6px 0; font-size: 13px;
    }
    #panel .fate-event .kind { font-weight: 600; }
    #panel .fate-event .when { color: var(--text-dim); flex: 1; }
    #panel .fate-event input { width: 76px; }
    #panel .fate-event button { background: none; border: none; color: #e06c6c; cursor: pointer; font-size: 15px; }
    #panel .hint { color: var(--text-dim); font-size: 12px; font-style: italic; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <aside id="rules"></aside>
  <aside id="panel"></aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
